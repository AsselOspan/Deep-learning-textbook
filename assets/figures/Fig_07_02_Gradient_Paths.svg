<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Затухание и рост произведения множителей</title><desc id="desc">На логарифмической шкале показаны значения модуля градиента от k равного нулю до восьми. Постоянный множитель 0,5 даёт затухание, а 1,5 даёт рост.</desc><defs>
