<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="356" viewBox="0 0 1200 356" role="img" aria-labelledby="title desc"><title id="title">Размерности тензоров CNN2</title><desc id="desc">Восемь шагов от батча развёрнутых изображений Fashion-MNIST до десяти логитов. Порядок показан стрелками и числами.</desc><defs><marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="30" y="44" width="235" height="104" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="147.5" y="73" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17444B">1  Батч изображений</text><text x="147.5" y="105" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#142A2D">B × 784</text><text x="147.5" y="131" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">Fashion-MNIST</text><rect x="331" y="44" width="235" height="104" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="448.5" y="73" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17444B">2  Входной тензор</text><text x="448.5" y="105" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#142A2D">B × 1 × 28 × 28</text><text x="448.5" y="131" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">Unflatten</text><rect x="632" y="44" width="235" height="104" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="749.5" y="73" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17444B">3  Свёртка и ReLU</text><text x="749.5" y="105" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#142A2D">B × 16 × 28 × 28</text><text x="749.5" y="131" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">Ядро 3 × 3, дополнение 1</text><rect x="933" y="44" width="235" height="104" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="1050.5" y="73" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17444B">4  Максимум в окне</text><text x="1050.5" y="105" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#142A2D">B × 16 × 14 × 14</text><text x="1050.5" y="131" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">MaxPool, окно и шаг 2</text><rect x="30" y="206" width="235" height="104" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="147.5" y="235" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17444B">8  Линейный слой</text><text x="147.5" y="267" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#142A2D">B × 10</text><text x="147.5" y="293" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">10 логитов</text><rect x="331" y="206" width="235" height="104" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="448.5" y="235" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17444B">7  Развёртка</text><text x="448.5" y="267" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#142A2D">B × 1568</text><text x="448.5" y="293" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">Flatten</text><rect x="632" y="206" width="235" height="104" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="749.5" y="235" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17444B">6  Максимум в окне</text><text x="749.5" y="267" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#142A2D">B × 32 × 7 × 7</text><text x="749.5" y="293" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">MaxPool, окно и шаг 2</text><rect x="933" y="206" width="235" height="104" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="1050.5" y="235" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17444B">5  Свёртка и ReLU</text><text x="1050.5" y="267" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#142A2D">B × 32 × 14 × 14</text><text x="1050.5" y="293" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">Ядро 3 × 3, дополнение 1</text><path d="M272 96 H324" fill="none" stroke="#17444B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/><path d="M573 96 H625" fill="none" stroke="#17444B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/><path d="M874 96 H926" fill="none" stroke="#17444B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/><path d="M324 258 H272" fill="none" stroke="#17444B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/><path d="M625 258 H573" fill="none" stroke="#17444B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/><path d="M926 258 H874" fill="none" stroke="#17444B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/><path d="M1050 154 V199" fill="none" stroke="#17444B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/><text x="30" y="342" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#17444B">B — размер батча. После второго пулинга 32 × 7 × 7 = 1568 признаков.</text></svg>
