><path d="M1058 123 V145" fill="none" stroke="#B3C8C8" stroke-width="2.5" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="147" width="204" height="89" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="130" y="187.5" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">AlexNet</text><text x="130" y="214.5" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#17444B">Глубокая CNN и GPU</text><rect x="260" y="147" width="204" height="72" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="362" y="179" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">VGG</text><text x="362" y="206" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#17444B">Стек свёрток 3 × 3</text><rect x="260" y="230" width="204" height="75" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="362" y="263.5" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">Inception</text><text x="362" y="290.5" font-family="Arial,sans-serif" font-size="16.5" font-weight="400" text-anchor="middle" fill="#17444B">Ветви разных масштабов</text><rect x="492" y="147" width="204" height="89" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="594" y="187.5" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">ResNet</text><text x="594" y="214.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Остаточная связь</text><rect x="724" y="147" width="204" height="89" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="826" y="187.5" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">EfficientNet</text><text x="826" y="214.5" font-family="Arial,sans-serif" font-size="17.5" font-weight="400" text-anchor="middle" fill="#17444B">Масштабирование CNN</text><rect x="956" y="147" width="204" height="89" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="1058" y="187.5" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">ViT</text><text x="1058" y="214.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Внимание к патчам</text><text x="28" y="337" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Слева направо показана последовательность работ. Интервалы между годами условны.</text></svg>
