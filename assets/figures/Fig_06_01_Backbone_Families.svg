<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="357" viewBox="0 0 1200 357" role="img" aria-labelledby="title desc"><title id="title">Избранные архитектуры компьютерного зрения</title><desc id="desc">История идей от AlexNet в 2012 году до Vision Transformer в 2020 году. Точки упорядочены по первым статьям или препринтам.</desc><defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker>
    <marker id="orange-tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9B4A27"/></marker>
