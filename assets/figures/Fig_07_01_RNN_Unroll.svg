<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Развёртка рекуррентной сети на три шага</title><desc id="desc">Скрытые состояния переходят слева направо. К трём обновлениям подаются три входа, из каждого нового состояния строится прогноз. Обратный проход переносит градиенты справа налево.</desc><defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker>
    <marker id="orange-tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9B4A27"/></marker>
