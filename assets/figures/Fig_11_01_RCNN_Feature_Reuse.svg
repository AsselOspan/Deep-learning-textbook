<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="484" viewBox="0 0 1200 484" role="img" aria-labelledby="title desc"><title id="title">Переиспользование свёрточных признаков</title><desc id="desc">R-CNN запускает свёртки на каждом предложении. Fast и Faster используют одну карту кадра. Faster получает предложения на ней же.</desc><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17686b"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b0552c"/></marker></defs><rect x="0" y="0" width="1200" height="484" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="36" y="45" font-family="Arial,sans-serif" font-size="32" text-anchor="start" fill="#162f37" font-weight="700">Где семейство R-CNN повторно использует признаки</text><text x="34" y="127" font-family="Arial,sans-serif" font-size="24" text-anchor="start" fill="#162f37" font-weight="700">R-CNN</text><rect x="207" y="94" width="222" height="56" rx="8" fill="#edf6f5" stroke="#acc3c7" stroke-width="2" /><text x="318" y="130" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">Внешние регионы</text><path d="M431 122H446" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><rect x="451" y="94" width="222" height="56" rx="8" fill="#edf6f5" stroke="#acc3c7" stroke-width="2" /><text x="562" y="130" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">Кадрирование</text><path d="M675 122H690" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><rect x="695" y="94" width="222" height="56" rx="8" fill="#d5e6f1" stroke="#acc3c7" stroke-width="2" /><text x="806" y="130" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">CNN для каждого</text><path d="M919 122H934" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><rect x="939" y="94" width="222" height="56" rx="8" fill="#edf6f5" stroke="#acc3c7" stroke-width="2" /><text x="1050" y="130" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">Класс и рамка</text><text x="34" y="240" font-family="Arial,sans-serif" font-size="24" text-anchor="start" fill="#162f37" font-weight="700">Fast R-CNN</text><rect x="207" y="207" width="222" height="56" rx="8" fill="#edf6f5" stroke="#acc3c7" stroke-width="2" /><text x="318" y="243" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">Весь кадр</text><path d="M431 235H446" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><rect x="451" y="207" width="222" height="56" rx="8" fill="#edf6f5" stroke="#acc3c7" stroke-width="2" /><text x="562" y="243" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">Одна CNN</text><path d="M675 235H690" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><rect x="695" y="207" width="222" height="56" rx="8" fill="#d5e6f1" stroke="#acc3c7" stroke-width="2" /><text x="806" y="243" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">Внешние RoI</text><path d="M919 235H934" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><rect x="939" y="207" width="222" height="56" rx="8" fill="#edf6f5" stroke="#acc3c7" stroke-width="2" /><text x="1050" y="243" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">RoI Pooling и головы</text><path d="M562 266V286H1050V267" fill="none" stroke="#b0552c" stroke-width="2" stroke-dasharray="7 5"/><text x="34" y="353" font-family="Arial,sans-serif" font-size="24" text-anchor="start" fill="#162f37" font-weight="700">Faster R-CNN</text><rect x="207" y="320" width="222" height="56" rx="8" fill="#edf6f5" stroke="#acc3c7" stroke-width="2" /><text x="318" y="356" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">Весь кадр</text><path d="M431 348H446" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><rect x="451" y="320" width="222" height="56" rx="8" fill="#edf6f5" stroke="#acc3c7" stroke-width="2" /><text x="562" y="356" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">Одна CNN</text><path d="M675 348H690" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><rect x="695" y="320" width="222" height="56" rx="8" fill="#d5e6f1" stroke="#acc3c7" stroke-width="2" /><text x="806" y="356" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">RPN на общей карте</text><path d="M919 348H934" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><rect x="939" y="320" width="222" height="56" rx="8" fill="#edf6f5" stroke="#acc3c7" stroke-width="2" /><text x="1050" y="356" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="700">RoI Pooling и головы</text><path d="M562 379V399H1050V380" fill="none" stroke="#b0552c" stroke-width="2" stroke-dasharray="7 5"/><text x="35" y="456" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#4e6268" font-weight="400">Пунктиром показана передача общей карты в региональный модуль.</text></svg>