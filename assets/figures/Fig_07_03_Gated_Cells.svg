<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Обновление состояния в LSTM и GRU</title><desc id="desc">В LSTM путь памяти объединяет предыдущее состояние и кандидата через независимые вентили. В GRU соглашение PyTorch назначает z долей старого состояния.</desc><defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker>
    <marker id="orange-tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9B4A27"/></marker>
   </defs><rect width="100%" height="100%" fill="white"/><path d="M600 22 V374" fill="none" stroke="#B3C8C8" stroke-width="2" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="47" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#17444B">LSTM</text><rect x="30" y="83" width="112" height="68" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="86" y="125" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#142A2D">cₜ₋₁</text><rect x="30" y="206" width="112" height="68" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="86" y="248" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#142A2D">gₜ</text><path d="M148 117 H187" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M148 240 H187" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="194" y="83" width="132" height="68" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="260" y="125" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">⊙ fₜ</text><rect x="194" y="206" width="132" height="68" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="260" y="248" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">⊙ iₜ</text><path d="M333 117 H370 V174 H393" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M333 240 H370 V174" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><circle cx="414" cy="174" r="17" fill="#E6F2F0" stroke="#17444B" stroke-width="2.5"/><text x="414" y="182" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#17444B">+</text><path d="M437 174 H469" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="476" y="140" width="101" height="68" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="526.5" y="182" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#142A2D">cₜ</text><text x="30" y="326" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#142A2D">cₜ = fₜ ⊙ cₜ₋₁ + iₜ ⊙ gₜ</text><text x="30" y="368" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#17444B">fₜ сохраняет память, iₜ пропускает кандидата.</text><text x="627" y="47" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#17444B">GRU в PyTorch</text><rect x="627" y="83" width="112" height="68" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="683" y="125" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#142A2D">hₜ₋₁</text><rect x="627" y="206" width="112" height="68" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="683" y="248" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#142A2D">nₜ</text><path d="M745 117 H784" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M745 240 H784" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="791" y="83" width="132" height="68" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="857" y="125" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">⊙ zₜ</text><rect x="791" y="206" width="132" height="68" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="857" y="248" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">⊙ (1 − zₜ)</text><path d="M930 117 H967 V174 H990" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M930 240 H967 V174" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1011" cy="174" r="17" fill="#E6F2F0" stroke="#17444B" stroke-width="2.5"/><text x="1011" y="182" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#17444B">+</text><path d="M1034 174 H1066" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="1073" y="140" width="101" height="68" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="1123.5" y="182" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#142A2D">hₜ</text><text x="627" y="326" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#142A2D">hₜ = zₜ ⊙ hₜ₋₁ + (1 − zₜ) ⊙ nₜ</text><text x="627" y="368" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#17444B">Чем ближе zₜ к 1, тем больше вклад старого состояния.</text></svg>
