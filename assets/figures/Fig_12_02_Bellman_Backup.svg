<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="690" viewBox="0 0 975 345" font-family="Arial, sans-serif">
    <defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#00796d"/></marker></defs>
    <rect width="975" height="345" fill="white"/><text x="48" y="43" fill="#173438" font-size="24" font-weight="700" text-anchor="start">Ожидаемая ценность действия вправо из клетки 14</text><rect x="53" y="105" width="290" height="117" rx="8" fill="#eaf3f1" stroke="#b9cccf"/><text x="75" y="139" fill="#14576a" font-size="21" font-weight="700" text-anchor="start">s = 14, a = вправо</text><text x="75" y="173" fill="#173438" font-size="19" font-weight="400" text-anchor="start">три возможных хода</text><text x="75" y="198" fill="#4c686c" font-size="17" font-weight="400" text-anchor="start">с вероятностью 1/3</text><path d="M343 162 L559 104" fill="none" stroke="#00796d" stroke-width="2.5" marker-end="url(#arr)"/><path d="M343 162 L559 167" fill="none" stroke="#00796d" stroke-width="2.5" marker-end="url(#arr)"/><path d="M343 162 L559 230" fill="none" stroke="#00796d" stroke-width="2.5" marker-end="url(#arr)"/><rect x="570" y="80" width="355" height="49" rx="8" fill="#f1f5f6" stroke="#b9cccf"/><rect x="570" y="143" width="355" height="49" rx="8" fill="#eaf3f1" stroke="#b9cccf"/><rect x="570" y="206" width="355" height="49" rx="8" fill="#f1f5f6" stroke="#b9cccf"/><text x="590" y="111" fill="#173438" font-size="17" font-weight="400" text-anchor="start">Вниз  14  ·  0 + 0,9 × 0,6 = 0,54</text><text x="590" y="174" fill="#173438" font-size="17" font-weight="400" text-anchor="start">Вправо  15  ·  цель, вклад 1</text><text x="590" y="237" fill="#173438" font-size="17" font-weight="400" text-anchor="start">Вверх  10  ·  0 + 0,9 × 0,5 = 0,45</text><rect x="53" y="275" width="872" height="44" rx="8" fill="#f8eee7" stroke="#b9cccf"/><text x="78" y="303" fill="#173438" font-size="19" font-weight="700" text-anchor="start">Один шаг Беллмана  (0,54 + 1 + 0,45) / 3 ≈ 0,6633</text></svg>