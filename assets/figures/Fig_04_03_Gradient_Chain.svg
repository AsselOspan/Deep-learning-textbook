<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Произведение локальных производных</title><desc id="desc">Обратный ход через четыре сигмоиды в точке ноль уменьшает входящий градиент в 256 раз. В четырёх активных ReLU при единичных весах градиент сохраняется.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="31" y="36" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#17444B">Обратный проход</text><text x="110" y="71" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#17444B">На выходе</text><text x="355" y="71" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#17444B">Слой 4</text><text x="600" y="71" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#17444B">Слой 3</text><text x="845" y="71" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#17444B">Слой 2</text><text x="1090" y="71" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#17444B">Слой 1</text><text x="31" y="107" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#17444B">Сигмоида при z = 0 во всех слоях</text><rect x="31" y="121" width="158" height="67" rx="9" fill="#F4F7F7" stroke="#DDE9E8" stroke-width="2"/><text x="110" y="163" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">1</text><path d="M198 156 H267" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><text x="233" y="143" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#9B4A27">× 0,25</text><rect x="276" y="121" width="158" height="67" rx="9" fill="#F4F7F7" stroke="#DDE9E8" stroke-width="2"/><text x="355" y="163" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">0,25</text><path d="M443 156 H512" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><text x="478" y="143" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#9B4A27">× 0,25</text><rect x="521" y="121" width="158" height="67" rx="9" fill="#F4F7F7" stroke="#DDE9E8" stroke-width="2"/><text x="600" y="163" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">0,0625</text><path d="M688 156 H757" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><text x="723" y="143" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#9B4A27">× 0,25</text><rect x="766" y="121" width="158" height="67" rx="9" fill="#F4F7F7" stroke="#DDE9E8" stroke-width="2"/><text x="845" y="163" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">0,015625</text><path d="M933 156 H1002" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><text x="968" y="143" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#9B4A27">× 0,25</text><rect x="1011" y="121" width="158" height="67" rx="9" fill="#E6F2F0" stroke="#DDE9E8" stroke-width="2"/><text x="1090" y="163" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">0,00390625</text><text x="31" y="228" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#17444B">ReLU при z = 1 во всех слоях</text><rect x="31" y="242" width="158" height="67" rx="9" fill="#F4F7F7" stroke="#DDE9E8" stroke-width="2"/><text x="110" y="284" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">1</text><path d="M198 277 H267" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><text x="233" y="264" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#9B4A27">× 1</text><rect x="276" y="242" width="158" height="67" rx="9" fill="#F4F7F7" stroke="#DDE9E8" stroke-width="2"/><text x="355" y="284" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">1</text><path d="M443 277 H512" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><text x="478" y="264" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#9B4A27">× 1</text><rect x="521" y="242" width="158" height="67" rx="9" fill="#F4F7F7" stroke="#DDE9E8" stroke-width="2"/><text x="600" y="284" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">1</text><path d="M688 277 H757" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><text x="723" y="264" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#9B4A27">× 1</text><rect x="766" y="242" width="158" height="67" rx="9" fill="#F4F7F7" stroke="#DDE9E8" stroke-width="2"/><text x="845" y="284" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">1</text><path d="M933 277 H1002" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><text x="968" y="264" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#9B4A27">× 1</text><rect x="1011" y="242" width="158" height="67" rx="9" fill="#E6F2F0" stroke="#DDE9E8" stroke-width="2"/><text x="1090" y="284" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">1</text><text x="31" y="347" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Веса равны 1. У сигмоид вход 0 и смещения после первого слоя −0,5. У ReLU вход 1, смещения 0.</text></svg>
