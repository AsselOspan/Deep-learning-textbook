<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Условное сравнение качества и задержки</title><desc id="desc">В учебном примере A, B и D недоминируемы. Вариант B имеет меньше задержку и выше качество, чем C.</desc><defs>
