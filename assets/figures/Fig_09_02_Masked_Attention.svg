<text x="75" y="456" dominant-baseline="middle" text-anchor="start" font-family="Arial, sans-serif" font-size="35" font-weight="400" fill="#506468">Запрещённая позиция получает нулевую вероятность. Нужен хотя бы один допустимый ключ.</text>
