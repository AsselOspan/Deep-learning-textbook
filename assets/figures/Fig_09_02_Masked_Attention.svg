<text x="268" y="276" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#506468">1, 0, 3</text>
<text x="268" y="316" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#506468">Третья позиция PAD</text>
