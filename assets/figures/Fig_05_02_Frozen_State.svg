<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="479" viewBox="0 0 1200 479" role="img" aria-labelledby="title desc"><title id="title">Градиенты параметров и режим модуля</title><desc id="desc">Столбцы различают отслеживание градиента параметров. Строки показывают режимы train и eval, которые независимо влияют на статистику BatchNorm и маску Dropout.</desc><defs>
   <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker>
   <marker id="orange-tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9B4A27"/></marker>
   </defs><rect width="100%" height="100%" fill="white"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#17444B">Две независимые настройки</text><rect x="225" y="61" width="455" height="65" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="690" y="61" width="476" height="65" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="452" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#17444B">requires_grad = False</text><text x="928" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#17444B">requires_grad = True</text><rect x="34" y="136" width="181" height="122" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="34" y="268" width="181" height="122" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="124" y="197" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#17444B">train()</text><text x="124" y="225" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#17444B">Обучение</text><text x="124" y="329" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#17444B">eval()</text><text x="124" y="357" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#17444B">Оценка</text><rect x="225" y="136" width="455" height="122" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="243" y="168" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#142A2D">Градиенты параметров отключены</text><text x="243" y="202" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">BatchNorm обновляет статистику</text><text x="243" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Dropout применяет случайную маску</text><rect x="225" y="268" width="455" height="122" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="243" y="300" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#142A2D">Градиенты параметров отключены</text><text x="243" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">BatchNorm берёт накопленную статистику</text><text x="243" y="366" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Dropout пропускает вход</text><rect x="690" y="136" width="476" height="122" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="708" y="168" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#142A2D">Можно вычислять градиенты</text><text x="708" y="202" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">BatchNorm обновляет статистику</text><text x="708" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Dropout применяет случайную маску</text><rect x="690" y="268" width="476" height="122" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="708" y="300" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#142A2D">Можно вычислять градиенты</text><text x="708" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">BatchNorm берёт накопленную статистику</text><text x="708" y="366" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Dropout пропускает вход</text><text x="34" y="424" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#17444B">Показан BatchNorm с track_running_stats=True.</text><text x="34" y="456" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#17444B">Градиенты требуют также включённого режима записи вычислений.</text></svg>
