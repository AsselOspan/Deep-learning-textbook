<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="453" viewBox="0 0 1200 453" role="img" aria-labelledby="title desc"><title id="title">Формы тензоров для полносвязного слоя</title><desc id="desc">Тот же пакет объектов умножают на транспонированный массив весов PyTorch или на массив весов Keras. Результат имеет форму пакет на число выходов.</desc><defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker>
    <marker id="back" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9B4A27"/></marker>
  </defs><rect width="100%" height="100%" fill="white"/><rect x="25" y="160" width="188" height="104" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="119" y="208" font-family="Arial,sans-serif" fill="#142A2D" font-weight="700" font-size="29" text-anchor="middle">X [B, d]</text><text x="119" y="237" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="19" text-anchor="middle">пакет входов</text><rect x="273" y="35" width="648" height="157" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><rect x="273" y="223" width="648" height="157" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><rect x="984" y="160" width="191" height="104" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="1079.5" y="208" font-family="Arial,sans-serif" fill="#142A2D" font-weight="700" font-size="29" text-anchor="middle">Z [B, h]</text><text x="1079.5" y="237" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="19" text-anchor="middle">общий выход</text><path d="M218 212 H244 V114 H268" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M244 212 V302 H268" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M926 114 H954 V212 H979" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M926 302 H954 V212" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><text x="298" y="75" font-family="Arial,sans-serif" fill="#17444B" font-weight="700" font-size="27" text-anchor="start">PyTorch nn.Linear</text><text x="298" y="120" font-family="Arial,sans-serif" fill="#142A2D" font-weight="700" font-size="30" text-anchor="start">Z = X Wᵀ + b</text><text x="298" y="160" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="22" text-anchor="start">W [h, d]    выход × вход</text><text x="298" y="263" font-family="Arial,sans-serif" fill="#17444B" font-weight="700" font-size="27" text-anchor="start">Keras Dense</text><text x="298" y="308" font-family="Arial,sans-serif" fill="#142A2D" font-weight="700" font-size="30" text-anchor="start">Z = X kernel + b</text><text x="298" y="348" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="22" text-anchor="start">kernel [d, h]    вход × выход</text><rect x="730" y="65" width="59" height="31" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="1"/><text x="759.5" y="87" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₁₁</text><rect x="789" y="65" width="59" height="31" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="1"/><text x="818.5" y="87" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₁₂</text><rect x="730" y="96" width="59" height="31" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="1"/><text x="759.5" y="118" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₂₁</text><rect x="789" y="96" width="59" height="31" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="1"/><text x="818.5" y="118" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₂₂</text><rect x="730" y="127" width="59" height="31" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="1"/><text x="759.5" y="149" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₃₁</text><rect x="789" y="127" width="59" height="31" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="1"/><text x="818.5" y="149" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₃₂</text><rect x="699" y="271" width="59" height="31" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="1"/><text x="728.5" y="293" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₁₁</text><rect x="758" y="271" width="59" height="31" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="1"/><text x="787.5" y="293" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₂₁</text><rect x="817" y="271" width="59" height="31" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="1"/><text x="846.5" y="293" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₃₁</text><rect x="699" y="302" width="59" height="31" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="1"/><text x="728.5" y="324" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₁₂</text><rect x="758" y="302" width="59" height="31" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="1"/><text x="787.5" y="324" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₂₂</text><rect x="817" y="302" width="59" height="31" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="1"/><text x="846.5" y="324" font-family="Arial,sans-serif" fill="#142A2D" font-weight="400" font-size="19" text-anchor="middle">w₃₂</text><text x="30" y="425" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="24" text-anchor="start">B — число объектов, d — число входов, h — число выходов. На схеме d = 2, h = 3.</text></svg>
