<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="447" viewBox="0 0 1200 447" role="img" aria-labelledby="title desc"><title id="title">Автоэнкодер и поиск соседей</title><desc id="desc">Кодировщик переводит изображение в 16 чисел. Декодировщик восстанавливает пиксели. MSE сравнивает реконструкцию с входом. В пространстве кодов ищут ближайших соседей.</desc><defs>
   <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker>
   <marker id="orange-tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9B4A27"/></marker>
   </defs><rect width="100%" height="100%" fill="white"/><text x="480" y="47" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#17444B">Кодировщик</text><text x="962" y="47" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#17444B">Декодировщик</text><path d="M267 66 H694" fill="none" stroke="#B3C8C8" stroke-width="2" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><path d="M749 66 H1176" fill="none" stroke="#B3C8C8" stroke-width="2" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="93" width="186" height="94" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="119" y="135" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">Вход x</text><text x="119" y="165" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#17444B">B × 784</text><rect x="267" y="93" width="186" height="94" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="360" y="135" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142A2D">Linear + ReLU</text><text x="360" y="165" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#17444B">B × 128</text><rect x="508" y="93" width="186" height="94" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="601" y="135" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142A2D">Линейный код</text><text x="601" y="165" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#17444B">B × 16</text><rect x="749" y="93" width="186" height="94" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="842" y="135" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142A2D">Linear + ReLU</text><text x="842" y="165" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#17444B">B × 128</text><rect x="990" y="93" width="186" height="94" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="1083" y="135" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Linear + Sigmoid</text><text x="1083" y="165" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#17444B">B × 784</text><path d="M219 140 H260" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M460 140 H501" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M701 140 H742" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M942 140 H983" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M601 195 V231" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="378" y="239" width="446" height="92" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="601" y="280" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">Поиск похожих изображений</text><text x="601" y="310" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#17444B">Евклидово расстояние в коде</text><path d="M118 194 V386 H846" fill="none" stroke="#9B4A27" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orange-tip)"/><path d="M1083 195 V337" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="854" y="344" width="322" height="84" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="1015" y="381" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">MSE между x и x̂</text><text x="1015" y="411" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Сравнение пикселей</text><text x="145" y="372" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#9B4A27">Исходное изображение служит целью</text></svg>
