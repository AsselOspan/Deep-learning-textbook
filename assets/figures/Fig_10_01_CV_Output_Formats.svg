<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="388" viewBox="0 0 1200 388" role="img" aria-labelledby="title desc"><title id="title">Четыре постановки компьютерного зрения</title><desc id="desc">Метка кадра, одна рамка, набор рамок и пиксельная карта показаны на синтетических фигурах.</desc><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17686b"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b0552c"/></marker></defs><rect x="0" y="0" width="1200" height="388" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="36" y="45" font-family="Arial,sans-serif" font-size="33" text-anchor="start" fill="#162f37" font-weight="700">Четыре выхода для задач компьютерного зрения</text><rect x="30" y="72" width="262" height="245" rx="9" fill="#edf6f5" stroke="#adc5c5" stroke-width="2" /><text x="161.0" y="108" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">Классификация</text><text x="161.0" y="138" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">Одна метка кадра</text><rect x="70" y="155" width="182" height="128" rx="7" fill="#e5ebed" stroke="#b8c9cb" stroke-width="2" /><rect x="96" y="181" width="52" height="52" rx="3" fill="#478c8b" stroke="none" stroke-width="2" /><text x="161" y="266" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#162f37" font-weight="700">квадрат</text><rect x="322" y="72" width="262" height="245" rx="9" fill="#edf6f5" stroke="#adc5c5" stroke-width="2" /><text x="453.0" y="108" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">Локализация</text><text x="453.0" y="138" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">Метка и одна рамка</text><rect x="362" y="155" width="182" height="128" rx="7" fill="#e5ebed" stroke="#b8c9cb" stroke-width="2" /><rect x="388" y="181" width="52" height="52" rx="3" fill="#478c8b" stroke="none" stroke-width="2" /><rect x="384" y="177" width="60" height="60" rx="0" fill="none" stroke="#b0552c" stroke-width="3" /><rect x="614" y="72" width="262" height="245" rx="9" fill="#edf6f5" stroke="#adc5c5" stroke-width="2" /><text x="745.0" y="108" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">Детектирование</text><text x="745.0" y="138" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">Список меток и рамок</text><rect x="654" y="155" width="182" height="128" rx="7" fill="#e5ebed" stroke="#b8c9cb" stroke-width="2" /><rect x="680" y="181" width="52" height="52" rx="3" fill="#478c8b" stroke="none" stroke-width="2" /><circle cx="785" cy="232" r="25" fill="#d58b59" stroke="none"/><rect x="676" y="177" width="60" height="60" rx="0" fill="none" stroke="#b0552c" stroke-width="3" /><rect x="756" y="203" width="58" height="58" rx="0" fill="none" stroke="#b0552c" stroke-width="3" /><rect x="906" y="72" width="262" height="245" rx="9" fill="#edf6f5" stroke="#adc5c5" stroke-width="2" /><text x="1037.0" y="108" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">Сегментация</text><text x="1037.0" y="138" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">Класс каждого пикселя</text><rect x="946" y="155" width="182" height="128" rx="7" fill="#e5ebed" stroke="#b8c9cb" stroke-width="2" /><rect x="972" y="181" width="52" height="52" rx="3" fill="#478c8b" stroke="none" stroke-width="2" /><circle cx="1077" cy="232" r="25" fill="#d58b59" stroke="none"/><text x="34" y="362" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#4e6268" font-weight="400">Для экземплярной сегментации дополнительно нужен идентификатор каждого объекта.</text></svg>