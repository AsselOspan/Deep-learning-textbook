<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="668" viewBox="0 0 975 334" font-family="Arial, sans-serif">
    <defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#00796d"/></marker></defs>
    <rect width="975" height="334" fill="white"/><text x="48" y="44" fill="#173438" font-size="24" font-weight="700" text-anchor="start">Два признака окончания эпизода</text><rect x="48" y="76" width="425" height="182" rx="8" fill="#f8eee7" stroke="#b9cccf"/><text x="72" y="114" fill="#a65332" font-size="21" font-weight="700" text-anchor="start">Физическое завершение</text><text x="72" y="149" fill="#173438" font-size="18" font-weight="700" text-anchor="start">terminated = True</text><text x="72" y="183" fill="#4c686c" font-size="16" font-weight="400" text-anchor="start">Пример · шест упал</text><text x="72" y="225" fill="#173438" font-size="19" font-weight="700" text-anchor="start">Цель y = r</text><rect x="502" y="76" width="425" height="182" rx="8" fill="#eaf3f1" stroke="#b9cccf"/><text x="526" y="114" fill="#00796d" font-size="21" font-weight="700" text-anchor="start">Внешний предел времени</text><text x="526" y="149" fill="#173438" font-size="16" font-weight="700" text-anchor="start">truncated = True, terminated = False</text><text x="526" y="183" fill="#4c686c" font-size="16" font-weight="400" text-anchor="start">Пример · достигнут лимит 500 шагов</text><text x="526" y="225" fill="#173438" font-size="19" font-weight="700" text-anchor="start">Цель y = r + γ max Q̄(s′, a′)</text><text x="48" y="300" fill="#4c686c" font-size="18" font-weight="400" text-anchor="start">Оба события требуют reset. Последнее s′ записывают в replay до reset.</text></svg>