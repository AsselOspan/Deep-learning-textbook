<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="445" viewBox="0 0 1200 445" role="img" aria-labelledby="title desc"><title id="title">Поле восприятия двух последовательных свёрток</title><desc id="desc">Первый слой преобразует входную карту 5 на 5 в промежуточную карту 3 на 3. Второй слой использует все девять промежуточных позиций. Их входные окна объединяются в поле 5 на 5.</desc><defs><marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="46" y="38" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#17444B">Вход 5 × 5</text><text x="460" y="38" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#17444B">Промежуточная карта 3 × 3</text><text x="993" y="38" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#17444B">Выход 1 × 1</text><rect x="46" y="65" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="94" y="65" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="142" y="65" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="190" y="65" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="238" y="65" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="46" y="113" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="94" y="113" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="142" y="113" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="190" y="113" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="238" y="113" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="46" y="161" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="94" y="161" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="142" y="161" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="190" y="161" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="238" y="161" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="46" y="209" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="94" y="209" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="142" y="209" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="190" y="209" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="238" y="209" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="46" y="257" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="94" y="257" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="142" y="257" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="190" y="257" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="238" y="257" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="46" y="65" width="240" height="240" fill="none" stroke="#17444B" stroke-width="3"/><rect x="94" y="113" width="144" height="144" fill="none" stroke="#9B4A27" stroke-width="4"/><rect x="530" y="113" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="578" y="113" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="626" y="113" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="530" y="161" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="578" y="161" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="626" y="161" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="530" y="209" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="578" y="209" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="626" y="209" width="48" height="48" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><rect x="530" y="113" width="144" height="144" fill="none" stroke="#17444B" stroke-width="3"/><rect x="578" y="161" width="48" height="48" fill="none" stroke="#9B4A27" stroke-width="4"/><rect x="1040" y="161" width="48" height="48" rx="0" fill="#B4DAD5" stroke="#B3C8C8" stroke-width="2"/><rect x="1040" y="161" width="48" height="48" fill="none" stroke="#17444B" stroke-width="3"/><path d="M305 185 H505" fill="none" stroke="#17444B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/><text x="405" y="159" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#17444B">Свёртка 3 × 3</text><path d="M698 185 H1015" fill="none" stroke="#17444B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/><text x="857" y="159" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#17444B">Свёртка 3 × 3</text><text x="46" y="347" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#17444B">Рамка выделяет окно входа для центральной позиции промежуточной карты.</text><text x="46" y="384" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#17444B">Второй слой использует все девять позиций. Объединение их окон покрывает 5 × 5.</text><text x="46" y="419" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#17444B">Обе свёртки выполняются с шагом 1 и без дополнения.</text></svg>
