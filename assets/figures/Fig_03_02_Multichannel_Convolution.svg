<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Свёртка по двум входным каналам</title><desc id="desc">Одно положение ядра даёт вклад минус один от первого канала и плюс один от второго. Смещение 0,5 добавляется один раз.</desc><defs><marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="135" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#17444B">Окно входа</text><text x="336" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#17444B">Ядро канала</text><text x="527" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#17444B">Вклад</text><text x="28" y="115" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#17444B">Канал 1</text><text x="28" y="245" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#17444B">Канал 2</text><rect x="145" y="65" width="49" height="49" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="169.5" y="97.83000000000001" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">1</text><rect x="194" y="65" width="49" height="49" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="218.5" y="97.83000000000001" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">2</text><rect x="145" y="114" width="49" height="49" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="169.5" y="146.83" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">3</text><rect x="194" y="114" width="49" height="49" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="218.5" y="146.83" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">1</text><rect x="145" y="65" width="98" height="98" fill="none" stroke="#17444B" stroke-width="4"/><rect x="145" y="195" width="49" height="49" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="169.5" y="227.83" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">2</text><rect x="194" y="195" width="49" height="49" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="218.5" y="227.83" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">1</text><rect x="145" y="244" width="49" height="49" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="169.5" y="276.83" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">0</text><rect x="194" y="244" width="49" height="49" rx="0" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="218.5" y="276.83" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">1</text><rect x="145" y="195" width="98" height="98" fill="none" stroke="#17444B" stroke-width="4"/><rect x="340" y="65" width="49" height="49" rx="0" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="364.5" y="97.83000000000001" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#142A2D">1</text><rect x="389" y="65" width="49" height="49" rx="0" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="413.5" y="97.83000000000001" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#142A2D">0</text><rect x="340" y="114" width="49" height="49" rx="0" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="364.5" y="146.83" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="m