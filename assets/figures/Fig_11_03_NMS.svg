<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="459" viewBox="0 0 1200 459" role="img" aria-labelledby="title desc"><title id="title">NMS внутри класса</title><desc id="desc">Дублирующий B подавлен A. Совпадающий с A прямоугольник D имеет другой класс и остаётся.</desc><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17686b"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b0552c"/></marker></defs><rect x="0" y="0" width="1200" height="459" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="36" y="45" font-family="Arial,sans-serif" font-size="32" text-anchor="start" fill="#162f37" font-weight="700">Подавление повторной рамки в пределах класса</text><rect x="42" y="77" width="483" height="310" rx="9" fill="#edf6f5" stroke="#adc5c5" stroke-width="2" /><text x="283.5" y="113" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">До NMS</text><text x="283.5" y="143" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">Четыре предсказания</text><rect x="669" y="77" width="483" height="310" rx="9" fill="#edf6f5" stroke="#adc5c5" stroke-width="2" /><text x="910.5" y="113" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">После NMS</text><text x="910.5" y="143" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">A, C и D</text><rect x="97" y="171" width="134" height="134" rx="0" fill="none" stroke="#17686b" stroke-width="4" /><rect x="105" y="179" width="134" height="134" rx="0" fill="none" stroke="#b0552c" stroke-width="4" stroke-dasharray="7 5"/><rect x="283" y="171" width="134" height="134" rx="0" fill="none" stroke="#17686b" stroke-width="4" /><rect x="92" y="166" width="144" height="144" rx="0" fill="none" stroke="#514b78" stroke-width="3" stroke-dasharray="3 5"/><text x="121" y="205" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#17686b" font-weight="700">A · 0,92</text><text x="126" y="275" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#514b78" font-weight="700">D · 0,68</text><text x="300" y="205" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#17686b" font-weight="700">C · 0,73</text><text x="121" y="242" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#b0552c" font-weight="700">B · 0,86</text><rect x="724" y="171" width="134" height="134" rx="0" fill="none" stroke="#17686b" stroke-width="4" /><rect x="910" y="171" width="134" height="134" rx="0" fill="none" stroke="#17686b" stroke-width="4" /><rect x="719" y="166" width="144" height="144" rx="0" fill="none" stroke="#514b78" stroke-width="3" stroke-dasharray="3 5"/><text x="748" y="205" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#17686b" font-weight="700">A · 0,92</text><text x="753" y="275" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#514b78" font-weight="700">D · 0,68</text><text x="927" y="205" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#17686b" font-weight="700">C · 0,73</text><path d="M534 218H657" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><text x="598" y="192" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#162f37" font-weight="700">0,5</text><text x="42" y="430" font-family="Arial,sans-serif" font-size="24" text-anchor="start" fill="#4e6268" font-weight="400">A, B, C относятся к классу 0. D относится к классу 1.</text></svg>