<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="347" viewBox="0 0 1200 347"><rect width="100%" height="100%" fill="white"/><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17444B"/></marker></defs><rect x="30" y="76" width="213" height="152" fill="#f4f7f7" stroke="#b3c8c8" stroke-width="2" rx="10"/><text x="136.5" y="111" font-family="Arial,sans-serif" fill="#17444B" font-weight="700" font-size="26" text-anchor="middle">Вход</text><text x="136.5" y="159" font-family="Arial,sans-serif" fill="#142a2d" font-weight="700" font-size="29" text-anchor="middle">x = (2; 1)</text><text x="136.5" y="199" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="24" text-anchor="middle">Два признака</text><path d="M248 151 L281 151" fill="none" stroke="#17444B" stroke-width="2" stroke-dasharray="" marker-end="url(#tip)"/><rect x="288" y="76" width="252" height="152" fill="#f4f7f7" stroke="#b3c8c8" stroke-width="2" rx="10"/><text x="414" y="111" font-family="Arial,sans-serif" fill="#17444B" font-weight="700" font-size="26" text-anchor="middle">Предактивация</text><text x="414" y="159" font-family="Arial,sans-serif" fill="#142a2d" font-weight="700" font-size="29" text-anchor="middle">z = (0,5; −0,5)</text><text x="414" y="199" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="24" text-anchor="middle">z = Wx + b</text><path d="M545 151 L579 151" fill="none" stroke="#17444B" stroke-width="2" stroke-dasharray="" marker-end="url(#tip)"/><rect x="586" y="76" width="252" height="152" fill="#e6f2f0" stroke="#b3c8c8" stroke-width="2" rx="10"/><text x="712" y="111" font-family="Arial,sans-serif" fill="#17444B" font-weight="700" font-size="26" text-anchor="middle">Скрытый слой</text><text x="712" y="159" font-family="Arial,sans-serif" fill="#142a2d" font-weight="700" font-size="29" text-anchor="middle">h = (0,5; 0)</text><text x="712" y="199" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="24" text-anchor="middle">h = ReLU(z)</text><path d="M843 151 L877 151" fill="none" stroke="#17444B" stroke-width="2" stroke-dasharray="" marker-end="url(#tip)"/><rect x="884" y="76" width="286" height="152" fill="#f4f7f7" stroke="#b3c8c8" stroke-width="2" rx="10"/><text x="1027" y="111" font-family="Arial,sans-serif" fill="#17444B" font-weight="700" font-size="26" text-anchor="middle">Выход</text><text x="1027" y="159" font-family="Arial,sans-serif" fill="#142a2d" font-weight="700" font-size="29" text-anchor="middle">z = 0,50</text><text x="1027" y="199" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="24" text-anchor="middle">z = vᵀh + c</text><text x="36" y="277" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="26" text-anchor="start">W имеет строки (0,5; −1) и (−0,5; 1).</text><text x="36" y="318" font-family="Arial,sans-serif" fill="#17444B" font-weight="400" font-size="26" text-anchor="start">b = (0,5; −0,5),   v = (2; −1),   c = −0,5</text></svg>