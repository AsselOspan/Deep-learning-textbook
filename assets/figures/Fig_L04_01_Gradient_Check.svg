<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-labelledby="title desc"><title id="title">Центральная разность для ReLU в нуле</title><desc id="desc">Прямая через точки минус эпсилон и плюс эпсилон имеет наклон 0,5. У самой ReLU односторонние наклоны 0 и 1, поэтому производная в нуле не существует.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="711" y="65" width="455" height="315" rx="9" fill="#F4F7F7" stroke="#DDE9E8" stroke-width="2"/><text x="739" y="113" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#17444B">Центральная разность</text><text x="940" y="174" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#142A2D">ReLU(ε) − ReLU(−ε)</text><path d="M768 190 H1112" fill="none" stroke="#17444B" stroke-width="2" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><text x="940" y="227" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#142A2D">2ε</text><text x="940" y="280" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#9B4A27">= ε / (2ε) = 0,5</text><text x="739" y="331" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#17444B">PyTorch выбирает grad = 0</text><text x="739" y="363" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#17444B">Математической производной в 0 нет.</text><path d="M68 301 H658" fill="none" stroke="#17444B" stroke-width="2.4" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M346 301 V45" fill="none" stroke="#17444B" stroke-width="2.4" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><text x="355" y="54" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#17444B">ReLU(z)</text><text x="667" y="310" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#17444B">z</text><path d="M92 301 H346 L576 71" fill="none" stroke="#17444B" stroke-width="5" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><path d="M189 301 L503 144" fill="none" stroke="#9B4A27" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round" stroke-linejoin="round"/><path d="M503 144 V301 M346 144 H503" fill="none" stroke="#516970" stroke-width="2" stroke-dasharray="5 7" stroke-linecap="round" stroke-linejoin="round"/><text x="334" y="150" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#17444B">ε</text><circle cx="189" cy="301" r="6" fill="#9B4A27" stroke="#9B4A27" stroke-width="2.5"/><circle cx="503" cy="144" r="6" fill="#9B4A27" stroke="#9B4A27" stroke-width="2.5"/><circle cx="346" cy="301" r="6" fill="#17444B" stroke="#17444B" stroke-width="2.5"/><text x="189" y="351" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#17444B">−ε</text><text x="346" y="351" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#17444B">0</text><text x="503" y="351" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#17444B">+ε</text><text x="85" y="247" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#17444B">Слева наклон 0</text><text x="523" y="190" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#17444B">Справа</text><text x="523" y="218" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#17444B">наклон 1</text><text x="30" y="408" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#17444B">Секущая измеряет изменение между двумя точками по разные стороны излома.</text></svg>
