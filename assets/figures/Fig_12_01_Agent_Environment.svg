<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="550" viewBox="0 0 975 275" font-family="Arial, sans-serif">
    <defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#00796d"/></marker></defs>
    <rect width="975" height="275" fill="white"/><text x="48" y="43" fill="#173438" font-size="24" font-weight="700" text-anchor="start">Один шаг взаимодействия</text><rect x="53" y="78" width="285" height="136" rx="8" fill="#eaf3f1" stroke="#b9cccf"/><text x="77" y="115" fill="#14576a" font-size="23" font-weight="700" text-anchor="start">Агент</text><text x="77" y="150" fill="#173438" font-size="19" font-weight="400" text-anchor="start">Наблюдает состояние</text><text x="77" y="176" fill="#4c686c" font-size="17" font-weight="400" text-anchor="start">выбирает действие по политике</text><rect x="627" y="78" width="295" height="136" rx="8" fill="#f1f5f6" stroke="#b9cccf"/><text x="650" y="115" fill="#14576a" font-size="23" font-weight="700" text-anchor="start">Среда</text><text x="650" y="150" fill="#173438" font-size="19" font-weight="400" text-anchor="start">Выполняет переход</text><text x="650" y="176" fill="#4c686c" font-size="16" font-weight="400" text-anchor="start">возвращает состояние и награду</text><path d="M338 112 L619 112" fill="none" stroke="#00796d" stroke-width="2.5" marker-end="url(#arr)"/><text x="479" y="98" fill="#00796d" font-size="17" font-weight="700" text-anchor="middle">действие aₜ</text><path d="M627 189 L346 189" fill="none" stroke="#00796d" stroke-width="2.5" marker-end="url(#arr)"/><text x="482" y="176" fill="#00796d" font-size="17" font-weight="700" text-anchor="middle">sₜ₊₁ и rₜ₊₁</text><text x="53" y="247" fill="#4c686c" font-size="17" font-weight="400" text-anchor="start">Новая пара состояния и награды влияет на следующий выбор.</text></svg>