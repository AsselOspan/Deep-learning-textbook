<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="446" viewBox="0 0 1200 446" role="img" aria-labelledby="title desc"><title id="title">Хронологическое разбиение и прямые горизонты прогноза</title><desc id="desc">Ряд из 6000 отсчётов делится по времени. Нормировка обучена на train. В каждой части окна из 48 отсчётов и цели для горизонтов один, три и шесть целиком находятся внутри этой части.</desc><defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker>
    <marker id="orange-tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9B4A27"/></marker>
   </defs><rect width="100%" height="100%" fill="white"/><text x="30" y="36" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#17444B">6000 отсчётов в порядке времени</text><rect x="30" y="56" width="684" height="66" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="372" y="85" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">Train 60 %</text><text x="372" y="112" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#17444B">Индексы [0; 3600)</text><rect x="714" y="56" width="228" height="66" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="828" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142A2D">Validation 20 %</text><text x="828" y="112" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#17444B">[3600; 4800)</text><rect x="942" y="56" width="228" height="66" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="1056" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142A2D">Test 20 %</text><text x="1056" y="112" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#17444B">[4800; 6000)</text><text x="30" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#17444B">Среднее и масштаб вычисляем по train и применяем ко всем трём частям.</text><text x="30" y="201" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#17444B">Один прогноз внутри выбранной части</text><rect x="30" y="221" width="500" height="66" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="280" y="262" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#17444B">48 известных отсчётов</text><path d="M537 254 H1153" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><circle cx="530" cy="254" r="8" fill="#17444B" stroke="white" stroke-width="2.5"/><circle cx="645" cy="254" r="9" fill="#9B4A27" stroke="white" stroke-width="2.5"/><circle cx="820" cy="254" r="9" fill="#9B4A27" stroke="white" stroke-width="2.5"/><circle cx="1083" cy="254" r="9" fill="#9B4A27" stroke="white" stroke-width="2.5"/><text x="31" y="318" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">t − 47</text><text x="530" y="318" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#17444B">t</text><text x="645" y="318" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#9B4A27">t + 1</text><text x="820" y="318" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#9B4A27">t + 3</text><text x="1083" y="318" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#9B4A27">t + 6</text><text x="30" y="356" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#17444B">Последний известный отсчёт — в t. Окно и все три цели остаются в одной части.</text><text x="30" y="407" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#17444B">Сравниваем повтор последнего значения с прогнозами RNN, GRU и LSTM.</text></svg>
