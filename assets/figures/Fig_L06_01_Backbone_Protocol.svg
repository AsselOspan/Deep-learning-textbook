<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="423" viewBox="0 0 1200 423" role="img" aria-labelledby="title desc"><title id="title">Протокол сравнения экстракторов Ford и Ferrari</title><desc id="desc">Два фиксированных экстрактора ResNet18 и MobileNetV3-Small используют одни и те же разделения. Для каждого обучают линейную голову и сравнивают тестовые метрики, задержку и параметры.</desc><defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker>
    <marker id="orange-tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9B4A27"/></marker>
   </defs><rect width="100%" height="100%" fill="white"/><rect x="27" y="146" width="260" height="103" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="157" y="193.5" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#142A2D">Ford vs Ferrari</text><text x="157" y="220.5" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#17444B">Одно разбиение данных</text><path d="M294 197 H323 V104 H356" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M323 197 V292 H356" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="364" y="62" width="280" height="86" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="504" y="101" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#142A2D">ResNet18</text><text x="504" y="128" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#17444B">Фиксированный экстрактор</text><rect x="364" y="250" width="280" height="86" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="504" y="289" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142A2D">MobileNetV3-Small</text><text x="504" y="316" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#17444B">Фиксированный экстрактор</text><path d="M651 104 H689" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M651 292 H689" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="696" y="62" width="201" height="86" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="796.5" y="101" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Линейная голова</text><text x="796.5" y="128" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">Обучение на train</text><rect x="696" y="250" width="201" height="86" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="796.5" y="289" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Линейная голова</text><text x="796.5" y="316" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">Обучение на train</text><path d="M904 104 H933 V197 H963" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M904 292 H933 V197" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><rect x="971" y="120" width="201" height="154" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="1071" y="155" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#17444B">Сравнение</text><text x="1071" y="192" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Macro-F1 на тесте</text><text x="1071" y="223" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Задержка p50/p95</text><text x="1071" y="253" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Число параметров</text><text x="29" y="374" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Разделения train, validation и test общие. Считаем все параметры и отдельно обучаемые.</text><text x="29" y="404" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Задержка прямого прохода с головой измеряется на CPU при одном потоке и батче 1.</text></svg>
