<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="468" viewBox="0 0 1200 468" role="img" aria-labelledby="title desc"><title id="title">Проверка градиента центральной разностью</title><desc id="desc">Две симметричные точки на графике потерь задают секущую. Её наклон сравнивают с наклоном касательной в исходной точке.</desc><defs>
