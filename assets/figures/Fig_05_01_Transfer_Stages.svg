<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="397" viewBox="0 0 1200 397" role="img" aria-labelledby="title desc"><title id="title">Два этапа переноса обучения</title><desc id="desc">На первом этапе меняется только голова. На втором параметры нижнего блока фиксированы, а верхний блок и голова обновляются с разными скоростями обучения.</desc><defs>
   <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker>
   <marker id="orange-tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9B4A27"/></marker>
   </defs><rect width="100%" height="100%" fill="white"/><text x="31" y="38" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#17444B">Этап 1. Обучение новой головы</text><rect x="31" y="56" width="161" height="81" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="111.5" y="91.5" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Вход</text><text x="111.5" y="121.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">x = (4; 1)</text><path d="M197 96 H221" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="226" y="56" width="161" height="81" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="306.5" y="91.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#142A2D">Нижний блок A</text><text x="306.5" y="121.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Фиксирован</text><path d="M392 96 H416" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="421" y="56" width="161" height="81" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="501.5" y="91.5" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Признаки</text><text x="501.5" y="121.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">u = (2; 1)</text><path d="M587 96 H611" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="616" y="56" width="161" height="81" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="696.5" y="91.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#142A2D">Верхний блок B, b</text><text x="696.5" y="121.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Фиксирован</text><path d="M782 96 H806" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="811" y="56" width="161" height="81" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="891.5" y="91.5" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Признаки</text><text x="891.5" y="121.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">h = (2,5; 1)</text><path d="M977 96 H1001" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="1006" y="56" width="161" height="81" rx="9" fill="#E6F2F0" stroke="#779E99" stroke-width="2"/><text x="1086.5" y="91.5" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Голова v, c</text><text x="1086.5" y="121.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Шаг η = 0,1</text><text x="31" y="179" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#17444B">Этап 2. Точная настройка верхнего блока и головы</text><rect x="31" y="198" width="161" height="81" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="111.5" y="233.5" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Вход</text><text x="111.5" y="263.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">x = (4; 1)</text><path d="M197 238 H221" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="226" y="198" width="161" height="81" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="306.5" y="233.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#142A2D">Нижний блок A</text><text x="306.5" y="263.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Фиксирован</text><path d="M392 238 H416" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="421" y="198" width="161" height="81" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="501.5" y="233.5" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Признаки</text><text x="501.5" y="263.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">u = (2; 1)</text><path d="M587 238 H611" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="616" y="198" width="161" height="81" rx="9" fill="#E6F2F0" stroke="#779E99" stroke-width="2"/><text x="696.5" y="233.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#142A2D">Верхний блок B, b</text><text x="696.5" y="263.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Шаг η = 0,02</text><path d="M782 238 H806" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="811" y="198" width="161" height="81" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="891.5" y="233.5" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Признаки</text><text x="891.5" y="263.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">h = (2,5; 1)</text><path d="M977 238 H1001" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="1006" y="198" width="161" height="81" rx="9" fill="#E6F2F0" stroke="#779E99" stroke-width="2"/><text x="1086.5" y="233.5" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142A2D">Голова v, c</text><text x="1086.5" y="263.5" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17444B">Шаг η = 0,1</text><rect x="31" y="307" width="24" height="19" rx="4" fill="#E6F2F0" stroke="#779E99" stroke-width="2"/><text x="66" y="324" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#17444B">Параметры обновляются на этом этапе.</text><text x="31" y="367" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#17444B">В обеих строках показаны признаки до обновления. После шага 2 верхний блок даст новый h.</text></svg>
