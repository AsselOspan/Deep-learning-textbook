<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="416" viewBox="0 0 1200 416" role="img" aria-labelledby="title desc"><title id="title">Две ветви Inception и остаточный блок</title><desc id="desc">Во фрагменте Inception выходы двух параллельных ветвей соединяют по каналам. В остаточном блоке x и F(x) поэлементно складывают.</desc><defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#17444B"/></marker>
    <marker id="orange-tip" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9B4A27"/></marker>
   </defs><rect width="100%" height="100%" fill="white"/><path d="M600 27 V378" fill="none" stroke="#B3C8C8" stroke-width="2" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="47" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#17444B">Две ветви Inception</text><text x="630" y="47" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#17444B">Остаточный блок</text><rect x="31" y="152" width="92" height="70" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="77" y="183" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">x</text><text x="77" y="210" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">вход</text><path d="M130 187 H151 V126 H175" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M151 187 V250 H175" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="181" y="94" width="84" height="64" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="223" y="134" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">1 × 1</text><rect x="181" y="218" width="84" height="64" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="223" y="258" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">1 × 1</text><path d="M273 250 H296" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="303" y="218" width="84" height="64" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="345" y="258" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142A2D">3 × 3</text><path d="M273 126 H400 V183 H424" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M395 250 H400 V183" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"/><rect x="430" y="146" width="143" height="75" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="501.5" y="179.5" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">Concat</text><text x="501.5" y="206.5" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17444B">по каналам</text><text x="31" y="327" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Пространственные размеры ветвей равны.</text><text x="31" y="360" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Число каналов после Concat складывается.</text><rect x="630" y="133" width="89" height="70" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="674.5" y="164" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">x</text><text x="674.5" y="191" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">вход</text><path d="M726 168 H789" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="796" y="133" width="137" height="70" rx="9" fill="#F4F7F7" stroke="#B3C8C8" stroke-width="2"/><text x="864.5" y="164" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#142A2D">F(x)</text><text x="864.5" y="191" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#17444B">поправка</text><path d="M941 168 H982" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><circle cx="1005" cy="168" r="18" fill="#E6F2F0" stroke="#17444B" stroke-width="2.5"/><text x="1005" y="177" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#17444B">+</text><path d="M1029 168 H1057" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="1063" y="133" width="105" height="70" rx="9" fill="#E6F2F0" stroke="#B3C8C8" stroke-width="2"/><text x="1115.5" y="164" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142A2D">y</text><text x="1115.5" y="191" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17444B">выход</text><path d="M751 168 V255 H1005 V191" fill="none" stroke="#17444B" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><text x="862" y="282" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#17444B">Короткая связь x</text><text x="630" y="327" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#17444B">y = x + F(x) перед активацией.</text><text x="630" y="360" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#17444B">Для сложения формы тензоров совпадают.</text></svg>
