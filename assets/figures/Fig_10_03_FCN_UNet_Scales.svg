<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="482" viewBox="0 0 1200 482" role="img" aria-labelledby="title desc"><title id="title">Многомасштабная ветвь сегментации</title><desc id="desc">После уменьшения карта увеличивается, соединяется с мелкой картой энкодера и формирует маску. Формы соответствуют учебной сети.</desc><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17686b"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b0552c"/></marker></defs><rect x="0" y="0" width="1200" height="482" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="34" y="44" font-family="Arial,sans-serif" font-size="32" text-anchor="start" fill="#162f37" font-weight="700">Грубые признаки и пространственная детализация</text><rect x="36" y="115" width="205" height="96" rx="9" fill="#edf6f5" stroke="#adc5c5" stroke-width="2" /><text x="138.5" y="151" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">Кадр</text><text x="138.5" y="181" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">B × 1 × 32 × 32</text><rect x="278" y="115" width="240" height="96" rx="9" fill="#edf6f5" stroke="#adc5c5" stroke-width="2" /><text x="398.0" y="151" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">Точная карта</text><text x="398.0" y="181" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">B × 12 × 32 × 32</text><rect x="555" y="115" width="246" height="96" rx="9" fill="#d5e6f1" stroke="#adc5c5" stroke-width="2" /><text x="678.0" y="151" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">Грубая карта</text><text x="678.0" y="181" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">B × 24 × 8 × 8</text><rect x="844" y="115" width="310" height="96" rx="9" fill="#d5e6f1" stroke="#adc5c5" stroke-width="2" /><text x="999.0" y="151" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">Интерполяция</text><text x="999.0" y="181" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">B × 24 × 32 × 32</text><rect x="574" y="307" width="260" height="96" rx="9" fill="#f9f0e8" stroke="#adc5c5" stroke-width="2" /><text x="704.0" y="343" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">Конкатенация</text><text x="704.0" y="373" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">12 + 24 = 36 каналов</text><rect x="873" y="307" width="281" height="96" rx="9" fill="#edf6f5" stroke="#adc5c5" stroke-width="2" /><text x="1013.5" y="343" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#162f37" font-weight="700">Маска</text><text x="1013.5" y="373" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#162f37" font-weight="400">B × 1 × 32 × 32</text><path d="M244 162H271" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><path d="M522 162H549" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><path d="M806 162H837" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><path d="M998 219V255H704V299" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><path d="M840 355H866" fill="none" stroke="#17686b" stroke-width="3" marker-end="url(#tip)"/><path d="M396 218V355H565" fill="none" stroke="#b0552c" stroke-width="3" marker-end="url(#gold)"/><text x="409" y="292" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#b0552c" font-weight="700">Пропускная связь</text><text x="36" y="452" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#4e6268" font-weight="400">Карта высокой детализации помогает восстановить контуры после уменьшения разрешения.</text></svg>